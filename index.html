<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Library</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;600&family=Literata:wght@400;600&display=swap">
<style>
:root {
  --paper: #f5f6f2;
  --ink: #1d2528;
  --muted: #5b6669;
  --shelf: #bfc7bd;
  --accent: #274c77;
  --phl: 84%;
  --pht: 28%;
  --serif: "Literata", "Iowan Old Style", "Palatino Linotype", Georgia, serif;
  --sans: "Hanken Grotesk", system-ui, -apple-system, "Segoe UI", sans-serif;
  color-scheme: light dark;
}
@media (prefers-color-scheme: dark) {
  :root {
    --paper: #12171a;
    --ink: #e7ebe4;
    --muted: #9aa5a2;
    --shelf: #364140;
    --accent: #8db4e6;
    --phl: 26%;
    --pht: 82%;
  }
}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body { margin: 0; background: var(--paper); color: var(--ink); font: 400 15px/1.45 var(--sans); }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
.wrap { max-width: 1100px; margin: 0 auto; padding: 1.25rem 1.25rem 2rem; overflow-x: clip; }

.bar { display: flex; flex-wrap: wrap; align-items: center; gap: .75rem 1rem; margin-bottom: 2rem; }
.tabs { display: flex; }
.tab { font: 600 15px var(--sans); background: none; border: 0; border-bottom: 2px solid transparent; color: var(--muted); padding: .4rem .1rem; margin-right: 1.25rem; cursor: pointer; }
.tab[aria-pressed="true"] { color: var(--ink); border-bottom-color: var(--accent); }
.tab .n { font-weight: 400; margin-left: .4rem; }
.tools { margin-left: auto; display: flex; flex-wrap: wrap; gap: .5rem; }
input[type="search"], select { font: inherit; color: var(--ink); background: transparent; border: 1px solid var(--shelf); border-radius: 6px; padding: .45rem .6rem; }
input[type="search"] { min-width: 15rem; }

.grid { --gx: .75rem; display: grid; gap: 2.5rem calc(var(--gx) * 2); grid-template-columns: repeat(auto-fill, minmax(var(--w), 1fr)); }
.grid.books { --w: 132px; }
.grid.albums { --w: 160px; }
.card { display: block; width: 100%; text-align: left; background: none; border: 0; padding: 0; color: inherit; font: inherit; cursor: pointer; }
.cover { position: relative; aspect-ratio: 2 / 3; border-radius: 2px; background: hsl(var(--h, 200) 18% var(--phl)); }
.albums .cover { aspect-ratio: 1; }
.cover::after { content: ""; position: absolute; left: calc(var(--gx) * -1); right: calc(var(--gx) * -1); bottom: -.55rem; height: 3px; border-radius: 1px; background: var(--shelf); }
.cover img { display: block; width: 100%; height: 100%; object-fit: cover; border-radius: 2px; outline: 1px solid rgb(0 0 0 / .08); outline-offset: -1px; }
.ph { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; padding: .6rem; text-align: center; overflow: hidden; font: 600 13px/1.25 var(--serif); color: hsl(var(--h, 200) 25% var(--pht)); }
.meta { margin-top: 1.1rem; }
.t, .c { display: -webkit-box; -webkit-box-orient: vertical; overflow: hidden; }
.t { -webkit-line-clamp: 2; font: 600 14px/1.3 var(--serif); }
.c { -webkit-line-clamp: 1; font-size: 13px; color: var(--muted); margin-top: .15rem; }
.card:hover .t { text-decoration: underline; text-underline-offset: 3px; }
.empty { color: var(--muted); margin: 2rem 0; }

dialog { border: 0; border-radius: 10px; padding: 0; width: 100%; max-width: min(560px, 92vw); background: var(--paper); color: var(--ink); }
dialog::backdrop { background: rgb(10 14 16 / .55); }
.d { position: relative; display: grid; grid-template-columns: minmax(120px, 200px) 1fr; gap: 1.25rem; padding: 1.5rem; }
.d .cover::after { display: none; }
.d h2 { font: 600 22px/1.2 var(--serif); margin: 0 2.5rem .25rem 0; }
.d .by { color: var(--muted); margin: 0 0 1rem; }
.d dl { margin: 0; display: grid; grid-template-columns: auto 1fr; gap: .35rem 1rem; }
.d dt { color: var(--muted); }
.d dd { margin: 0; }
.d .notes { white-space: pre-wrap; margin: 1rem 0 0; }
.d a { color: var(--accent); }
.d .more { margin: 1rem 0 0; }
.close { position: absolute; top: .6rem; right: .6rem; font: 600 14px var(--sans); color: var(--ink); background: transparent; border: 1px solid var(--shelf); border-radius: 6px; padding: .3rem .6rem; cursor: pointer; }
@media (max-width: 480px) {
  .d { grid-template-columns: 1fr; }
  .d .cover { max-width: 200px; }
  input[type="search"] { min-width: 0; width: 100%; }
  .tools { margin-left: 0; width: 100%; }
}
.foot { margin-top: 2.5rem; color: var(--muted); font-size: 13px; }
.foot a { color: var(--accent); }
</style>
</head>
<body>
<div class="wrap">
  <h1 class="sr">Library</h1>
  <div class="bar">
    <div class="tabs" role="group" aria-label="Collection">
      <button class="tab" type="button" data-tab="books" aria-pressed="true">Books<span class="n" id="n-books"></span></button>
      <button class="tab" type="button" data-tab="albums" aria-pressed="false">Albums<span class="n" id="n-albums"></span></button>
    </div>
    <div class="tools">
      <input id="q" type="search" aria-label="Search" placeholder="Search title or author" autocomplete="off">
      <select id="sort" aria-label="Sort"></select>
    </div>
  </div>
  <div id="grid" class="grid books"></div>
  <p id="empty" class="empty" hidden>No matches. Try a different spelling.</p>
  <p id="foot" class="foot"></p>
</div>

<dialog id="detail" aria-label="Details">
  <div class="d" id="detailBody"></div>
</dialog>

<script>
(function () {
  var $ = function (s) { return document.querySelector(s); };
  var data = { books: [], albums: [], generated: null };
  var state = { tab: "books", q: "", sort: "title" };

  function fold(s) {
    return String(s == null ? "" : s).normalize("NFD").replace(/[\u0300-\u036f]/g, "").toLowerCase();
  }
  function sortKey(s) { return fold(s).replace(/^(the|a|an) /, ""); }
  function creator(it) { return state.tab === "books" ? (it.author || "") : (it.artist || ""); }
  function hue(str) {
    var h = 0, s = String(str || "");
    for (var i = 0; i < s.length; i++) { h = (h * 31 + s.charCodeAt(i)) % 360; }
    return h;
  }
  function cleanIsbn(v) { return String(v || "").replace(/[^0-9Xx]/g, ""); }

  function coverSrc(it, size) {
    if (state.tab === "books") {
      var isbn = cleanIsbn(it.isbn);
      return isbn ? "https://covers.openlibrary.org/b/isbn/" + isbn + "-" + size + ".jpg?default=false" : null;
    }
    return it.cover || null;
  }

  function makeCover(it, size) {
    var d = document.createElement("div");
    d.className = "cover";
    d.style.setProperty("--h", hue(it.title));
    function placeholder() {
      if (d.querySelector(".ph")) return;
      var p = document.createElement("div");
      p.className = "ph";
      p.textContent = it.title || "";
      d.appendChild(p);
    }
    var src = coverSrc(it, size);
    if (!src) { placeholder(); return d; }
    var img = new Image();
    img.alt = "";
    img.loading = "lazy";
    img.decoding = "async";
    img.addEventListener("error", function () { img.remove(); placeholder(); });
    img.src = src;
    d.appendChild(img);
    return d;
  }

  function visible() {
    var q = fold(state.q).trim();
    var list = data[state.tab].filter(function (it) {
      return !q || fold((it.title || "") + " " + creator(it)).indexOf(q) !== -1;
    });
    list.sort(function (a, b) {
      var cmp = function (x, y) { return sortKey(x).localeCompare(sortKey(y), undefined, { numeric: true }); };
      if (state.sort === "year") {
        var d = (parseInt(b.year, 10) || 0) - (parseInt(a.year, 10) || 0);
        return d || cmp(a.title, b.title);
      }
      if (state.sort === "creator") {
        return cmp(creator(a), creator(b)) || cmp(a.title, b.title);
      }
      return cmp(a.title, b.title);
    });
    return list;
  }

  function makeCard(it) {
    var b = document.createElement("button");
    b.type = "button";
    b.className = "card";
    var by = creator(it);
    b.setAttribute("aria-label", (it.title || "Untitled") + (by ? ", " + by : ""));
    b.appendChild(makeCover(it, "M"));
    var meta = document.createElement("div");
    meta.className = "meta";
    var t = document.createElement("div");
    t.className = "t";
    t.textContent = it.title || "Untitled";
    var c = document.createElement("div");
    c.className = "c";
    c.textContent = by;
    meta.appendChild(t);
    meta.appendChild(c);
    b.appendChild(meta);
    b.addEventListener("click", function () { openDetail(it); });
    return b;
  }

  function setSortOptions() {
    var opts = state.tab === "books"
      ? [["title", "Title"], ["creator", "Author"]]
      : [["title", "Title"], ["creator", "Artist"], ["year", "Year, newest first"]];
    var sel = $("#sort");
    if (!opts.some(function (o) { return o[0] === state.sort; })) state.sort = "title";
    sel.replaceChildren();
    opts.forEach(function (o) {
      var op = document.createElement("option");
      op.value = o[0];
      op.textContent = o[1];
      sel.appendChild(op);
    });
    sel.value = state.sort;
    $("#q").placeholder = state.tab === "books" ? "Search title or author" : "Search title or artist";
  }

  function render() {
    var grid = $("#grid");
    grid.className = "grid " + state.tab;
    grid.replaceChildren();
    var items = visible();
    items.forEach(function (it) { grid.appendChild(makeCard(it)); });
    $("#empty").hidden = items.length > 0;
    $("#n-books").textContent = data.books.length;
    $("#n-albums").textContent = data.albums.length;
  }

  function addRow(dl, label, value) {
    if (value == null || value === "") return;
    var dt = document.createElement("dt");
    dt.textContent = label;
    var dd = document.createElement("dd");
    dd.textContent = value;
    dl.appendChild(dt);
    dl.appendChild(dd);
  }

  function openDetail(it) {
    var body = $("#detailBody");
    body.replaceChildren();
    body.appendChild(makeCover(it, "L"));

    var right = document.createElement("div");
    var h = document.createElement("h2");
    h.textContent = it.title || "Untitled";
    var by = document.createElement("p");
    by.className = "by";
    by.textContent = creator(it);
    right.appendChild(h);
    right.appendChild(by);

    if (state.tab === "albums") {
      var dl = document.createElement("dl");
      addRow(dl, "Format", it.format);
      addRow(dl, "Year", it.year);
      if (dl.children.length) right.appendChild(dl);
    } else {
      if (it.notes) {
        var n = document.createElement("p");
        n.className = "notes";
        n.textContent = it.notes;
        right.appendChild(n);
      }
      var isbn = cleanIsbn(it.isbn);
      if (isbn) {
        var p = document.createElement("p");
        p.className = "more";
        var a = document.createElement("a");
        a.href = "https://openlibrary.org/isbn/" + isbn;
        a.target = "_blank";
        a.rel = "noopener";
        a.textContent = "View on Open Library";
        p.appendChild(a);
        right.appendChild(p);
      }
    }
    body.appendChild(right);

    var close = document.createElement("button");
    close.type = "button";
    close.className = "close";
    close.textContent = "Close";
    close.addEventListener("click", function () { $("#detail").close(); });
    body.appendChild(close);
    $("#detail").showModal();
  }

  $("#detail").addEventListener("click", function (e) {
    if (e.target === this) this.close();
  });
  document.querySelectorAll(".tab").forEach(function (btn) {
    btn.addEventListener("click", function () {
      state.tab = btn.getAttribute("data-tab");
      document.querySelectorAll(".tab").forEach(function (b) {
        b.setAttribute("aria-pressed", String(b === btn));
      });
      setSortOptions();
      render();
    });
  });
  $("#q").addEventListener("input", function (e) { state.q = e.target.value; render(); });
  $("#sort").addEventListener("change", function (e) { state.sort = e.target.value; render(); });

  function footer() {
    var f = $("#foot");
    f.replaceChildren();
    if (data.generated) {
      var d = new Date(data.generated);
      if (!isNaN(d)) f.appendChild(document.createTextNode("Updated " + d.toLocaleDateString(undefined, { year: "numeric", month: "long", day: "numeric" }) + ". "));
    }
    f.appendChild(document.createTextNode("Book covers and details from "));
    var a = document.createElement("a");
    a.href = "https://openlibrary.org";
    a.target = "_blank";
    a.rel = "noopener";
    a.textContent = "Open Library";
    f.appendChild(a);
    f.appendChild(document.createTextNode("."));
  }

  setSortOptions();
  footer();
  fetch("data.json?t=" + Math.floor(Date.now() / 60000))
    .then(function (r) { if (!r.ok) throw new Error(r.status); return r.json(); })
    .then(function (j) {
      data.books = j.books || [];
      data.albums = j.albums || [];
      data.generated = j.generated || null;
      footer();
      render();
    })
    .catch(function () {
      var e = $("#empty");
      e.textContent = "The library didn't load. Refresh the page to try again.";
      e.hidden = false;
    });
})();
</script>
</body>
</html>
